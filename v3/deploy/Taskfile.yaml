version: "3"

tasks:
  iot:
    cmds:
      - task: compose
        vars:
          NETWORK: "iot"
          APP: "mqtt"
      - task: compose
        vars:
          NETWORK: "iot"
          APP: "zigbee2mqtt"
      - task: compose
        vars:
          VOLUME_PATH: "./iot/nodered/nodered-data"
          NETWORK: "iot"
          APP: "nodered"
  infra:
    cmds:
      - task: compose
        vars:
          NETWORK: "infra"
          APP: "traefik"
  apps:
    cmds:
      - task: compose
        vars:
          NETWORK: "apps"
          APP: "dash"
  compose:
    vars:
      VOLUME_PATH: '{{default "" .VOLUME_PATH}}'
    cmds:
      - |
        echo "Deploying {{.APP}} on {{.NETWORK}} network"
        if [ -n "{{.VOLUME_PATH}}" ]; then
          echo "Pre-creating {{.VOLUME_PATH}}"
          mkdir -p "{{.VOLUME_PATH}}"
        fi
        if ! docker network ls | grep -q "{{.NETWORK}}"; then
          echo "Creating Docker network: {{.NETWORK}}"
          docker network create {{.NETWORK}}
        else
          echo "Docker network {{.NETWORK}} already exists."
        fi

        docker compose -f {{.NETWORK}}/{{.APP}}/docker-compose.yaml up -d --remove-orphans --wait
    requires:
      vars: [NETWORK, APP]
