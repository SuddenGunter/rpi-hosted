services:
    mqtt:
        image: eclipse-mosquitto:2.1.2-alpine
        restart: unless-stopped
        volumes:
            - './mqtt/mosquitto-data:/mosquitto'
            - './mqtt/custom.conf:/mqttconf/custom.conf'
            - './mqtt/mqttcreds.txt:/mqttconf/mqttcreds.txt'
        command: 'mosquitto -c /mqttconf/custom.conf'
        expose:
          - 1883/tcp
        networks:
          - iot
    zigbee2mqtt:
        restart: unless-stopped
        image: koenkk/zigbee2mqtt:2.14
        depends_on:
            - mqtt
        volumes:
            - ./zigbee2mqtt:/app/data
            - /run/udev:/run/udev:ro
        environment:
            - TZ=Europe/London
        devices:
            - /dev/ttyUSB0:/dev/ttyUSB0
        expose:
            - 8080/tcp
        networks:
            - iot
    nodered:
      image: nodered/node-red:4.1.17-18
      restart: unless-stopped
      depends_on:
          - mqtt
      environment:
          - TZ=Europe/London
      expose:
          - 1880/tcp
      volumes:
          - './nodered/nodered-data:/data'
      networks:
          - iot
networks:
  iot:
    name: iot
    external: true
